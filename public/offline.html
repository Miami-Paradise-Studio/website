<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Offline - Miami Paradise Studio</title>
	<style>
		:root {
			--black: #06020A;
			--aqua: #00E8FF;
			--persian-rose: #FC109C;
			--text-light: #F5F5FF;
			--text-medium: #AEAEC5;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: var(--black);
			color: var(--text-light);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 20px;
		}

		.offline-container {
			max-width: 500px;
			padding: 40px;
			background: rgba(14, 9, 26, 0.9);
			border-radius: 16px;
			border: 1px solid rgba(0, 232, 255, 0.3);
			box-shadow: 0 0 30px rgba(0, 232, 255, 0.2);
		}

		.offline-icon {
			width: 64px;
			height: 64px;
			fill: var(--aqua);
			margin-bottom: 20px;
		}

		.offline-title {
			font-size: 2rem;
			font-weight: 700;
			margin-bottom: 16px;
			color: var(--aqua);
		}

		.offline-message {
			color: var(--text-medium);
			margin-bottom: 30px;
			line-height: 1.6;
		}

		.retry-btn {
			display: inline-block;
			background: linear-gradient(135deg, var(--aqua), var(--persian-rose));
			color: var(--black);
			padding: 12px 24px;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 600;
			text-decoration: none;
		}

		.retry-btn:hover {
			filter: brightness(1.1);
		}

		.cached-pages {
			margin-top: 30px;
			padding-top: 20px;
			border-top: 1px solid rgba(0, 232, 255, 0.2);
		}

		.cached-pages h2 {
			color: var(--aqua);
			margin-bottom: 15px;
			font-size: 1.2rem;
		}

		.cached-links {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.cached-link {
			color: var(--text-light);
			text-decoration: none;
			padding: 8px 16px;
			border-radius: 6px;
			border: 1px solid rgba(0, 232, 255, 0.2);
		}

		.cached-link:hover {
			background: rgba(0, 232, 255, 0.1);
			border-color: var(--aqua);
		}

		@media (max-width: 480px) {
			.offline-container {
				padding: 30px 20px;
			}

			.offline-title {
				font-size: 1.5rem;
			}
		}
	</style>
</head>

<body>
	<div class="offline-container">
		<svg class="offline-icon" viewBox="0 0 640 512" aria-hidden="true" focusable="false">
			<path
				d="M54.2 202.9C123.2 136.7 216.8 96 320 96s196.8 40.7 265.8 106.9c12.8 12.2 33 11.8 45.2-.9s11.8-33-.9-45.2C549.7 79.5 440.4 32 320 32S90.3 79.5 9.8 156.7C-2.9 169-3.3 189.2 8.9 202s32.5 13.2 45.2 .9zM320 256c56.8 0 108.6 21.1 148.2 56c13.3 11.7 33.5 10.4 45.2-2.8s10.4-33.5-2.8-45.2C459.8 219.2 393 192 320 192s-139.8 27.2-190.5 72c-13.3 11.7-14.5 31.9-2.8 45.2s31.9 14.5 45.2 2.8c39.5-34.9 91.3-56 148.2-56zm64 160a64 64 0 1 0 -128 0 64 64 0 1 0 128 0z" />
		</svg>
		<h1 class="offline-title">You're Offline</h1>
		<p class="offline-message">
			No internet connection detected. Some content may not be available, but you can still browse cached pages.
		</p>

		<a href="/" class="retry-btn">Try again</a>

		<div class="cached-pages">
			<h2>Available Offline</h2>
			<div class="cached-links">
				<a href="/" class="cached-link">Home</a>
				<a href="/shard-protocol" class="cached-link">SHARD Protocol</a>
			</div>
		</div>
	</div>
</body>

</html>
