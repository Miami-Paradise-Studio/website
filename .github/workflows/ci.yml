name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Astro 7 requires >= 22.12.
  NODE_VERSION: '22.12'

jobs:
  build:
    name: Types, styles, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Stylelint
        run: npm run lint:css

      - run: npm run build

      # Per-chunk byte budgets. A page-level score cannot tell you that one
      # drei helper added 80 kB to the hero island; this can.
      - name: Byte budgets
        run: npm run test:size

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: End to end and accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # xvfb-run keeps Chromium on a real GPU path. Headless shell falls back to
      # software rendering, where the WebGL hero either takes tens of seconds or
      # never paints, and every canvas assertion becomes meaningless.
      - name: Playwright
        run: xvfb-run -a npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Three runs and the median, because single-run performance numbers on a
      # shared CI runner flake enough to fail a green build.
      - name: Lighthouse CI
        run: npm run test:lighthouse

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
